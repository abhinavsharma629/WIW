      <path d="M106 246C127 202 126 153 108 111L99 64"/>
    </g>
    <use href="#leaf-shape" transform="translate(118 219) rotate(-24) scale(.85)"/>
    <use href="#leaf-shape" transform="translate(123 191) rotate(115) scale(.8)"/>
    <use href="#leaf-shape" transform="translate(120 157) rotate(-35) scale(.75)"/>
    <use href="#leaf-shape" transform="translate(111 123) rotate(125) scale(.7)"/>
    <use href="#flower" transform="translate(99 64) scale(.75) rotate(-12)"/>
