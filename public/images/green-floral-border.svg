        <use href="#petal-shape" transform="rotate(90)"/>
        <use href="#petal-shape" transform="rotate(180)"/>
        <use href="#petal-shape" transform="rotate(270)"/>
      </g>
      <circle r="10" fill="#a2b98b"/>
      <path d="M-7 2C-9-7 7-10 8-1 9 7-4 9-5 2-6-3 4-4 4 1" stroke="#708d5d" stroke-width="1.2" stroke-linecap="round"/>
