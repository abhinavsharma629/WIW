      <stop stop-color="#b6c6a2"/>
      <stop offset="1" stop-color="#6b8a61"/>
    </linearGradient>
    <radialGradient id="petal">
      <stop stop-color="#dce5c8"/>
      <stop offset=".65" stop-color="#b7caa0"/>
      <stop offset="1" stop-color="#8eac7b"/>
    </radialGradient>
    <path id="leaf-shape" d="M0 0C-24-2-42-20-41-43-15-40 3-21 0 0Z" fill="url(#leaf)"/>
    <path id="petal-shape" d="M0 6C-25-1-39-18-30-35-22-49-3-38 0-26 8-44 28-46 35-30 42-10 20 1 0 6Z" fill="url(#petal)" stroke="#92a982" stroke-width=".7"/>
    <g id="flower">
